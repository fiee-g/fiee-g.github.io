<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body id="top">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top">我的个人主页</a>
      <nav class="main-nav" id="main-nav"></nav>
      <a href="private.html" class="btn-personal">个人端</a>
    </div>
  </header>

  <main class="container page">
    <!-- 左侧栏：照片 + 名字 + 签名 -->
    <aside class="sidebar">
      <div class="photo" id="photo">
        <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path>
        </svg>
        <span class="photo-hint">换成你的照片</span>
      </div>
      <h1 class="side-name" id="hero-name">你的名字</h1>
      <p class="side-title" id="hero-title"></p>
      <p class="signature" id="signature"></p>
    </aside>

    <!-- 右侧：内容 -->
    <div class="content">
      <section class="intro-card">
        <p id="intro"></p>
      </section>

      <div id="sections"></div>

      <section class="section contact" id="contact"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footer-brand">我的个人主页</span> · 由自己搭建</p>
      <p class="muted small">私密内容在 <a href="private.html">个人端</a></p>
    </div>
  </footer>

  <script src="js/config.js?v=7"></script>
  <script src="js/main.js?v=6"></script>
</body>
</html>
